# peloton-sync.conf — per-user configuration for the Peloton → Airtable sync.
#
# This file ships with the repo defaults. To point the tools at a different
# Peloton account / Airtable base WITHOUT editing the repo, copy this file to
# ~/.peloton-sync.conf and edit the copy — it is loaded after this one and
# overrides it.
#
# Format: shell-sourceable KEY="value" lines only (the same file is parsed by
# peloton_config.py for the Python scripts, which only understands simple
# assignments — no command substitution or variable expansion).

# Peloton leaderboard username. Workout CSV exports are named
# <username>_workouts*.csv — this drives auto-detection in ~/Downloads.
PELOTON_USERNAME="Big__Cheese"

# Airtable base ID
AIRTABLE_BASE_ID="appBmQA2p3z2Fdofa"

# Table IDs within the base
PELOTON_TABLE_ID="tblBuzhfztfwgE59f"             # Peloton (workout history)
PELOTON_RIDES_TABLE_ID="tblht11eg2nJ5gh3o"       # Peloton-Rides (class metadata)
PELOTON_TYPE_TABLE_ID="tblcUCbRTQbN6B4uK"        # Peloton_type lookup (matcher Power Zone hint)
PELOTON_INSTRUCTOR_TABLE_ID="tbltRUHnRrncwUbnQ"  # Peloton_Instructor lookup
